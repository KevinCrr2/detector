<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Escáner de productos</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Lector de códigos -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 18px 20px;
      text-align: center;
      background: #181818;
      border-bottom: 1px solid #333;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    .scanner {
      width: 100%;
      background: #000;
      overflow: hidden;
    }

    #reader {
      width: 100%;
      min-height: 320px;
      background: #000;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
      object-fit: cover;
    }

    .bottom {
      padding: 20px;

      flex-direction: column;
      gap: 14px;
    }

    .status {
      text-align: center;
      color: #aaa;

      min-height: 20px;
    }

    .result {
      background: #1d1d1d;

      border-radius: 12px;

    .result small {
      display: block;

    #code {

    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;

      background: #00e676;
      color: #000;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    #detener {
      background: #333;
      color: white;
    }

    .error {
      color: #ff5252;
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
    }

    .encontrado {
      border-color: #00e676;
    }

    .no-encontrado {
      border-color: #ff5252;
    }

    .info {
      color: #aaa;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
    }

    /* Ocultar elementos propios de html5-qrcode que no necesitamos */
    #reader__dashboard_section_csr button {
      width: auto;
      padding: 10px 15px;
      margin: 5px;
      background: #00e676;
    }

    #reader__dashboard_section_swaplink {
      color: #00e676 !important;
    }
  </style>
</head>

<body>

<header>
  <h1>📷 Escáner de productos</h1>
</header>

<div class="scanner">
  <div id="reader"></div>
</div>

<div class="bottom">

  <div class="status" id="status">
    Preparando cámara...
  </div>

  <div class="result">
    <small>Código detectado</small>
    <div id="code">—</div>
  </div>

  <div class="result" id="productoBox">
    <small>Producto</small>

    <div id="producto">
      Escaneá un producto
    </div>
  </div>

  <button id="escanearNuevamente" style="display:none;">
    📷 Escanear nuevamente
  </button>

  <button id="detener" style="display:none;">
    Detener cámara
  </button>

  <div class="error" id="error"></div>

  <div class="info">
    Apuntá la cámara al código de barras del producto.
  </div>

</div>


<script>

  /*
  =====================================================
  SUPABASE
  =====================================================
  */

  const SUPABASE_URL =
    "https://rmfgtifajffxbvcgfuep.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_a_Y_DO0ZDmo_dS4_T2RugA_kWRjMFWT";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


  /*
  =====================================================
  ELEMENTOS
  =====================================================
  */

  const statusElement =
    document.getElementById("status");

  const codeElement =
    document.getElementById("code");

  const productoElement =
    document.getElementById("producto");

  const productoBox =
    document.getElementById("productoBox");

  const errorElement =
    document.getElementById("error");

  const escanearNuevamente =
    document.getElementById("escanearNuevamente");

  const detenerButton =
    document.getElementById("detener");


  /*
  =====================================================
  VARIABLES
  =====================================================
  */

  let scanner = null;

  let procesando = false;

  let ultimoCodigo = "";


  /*
  =====================================================
  INICIAR ESCÁNER
  =====================================================
  */

  async function iniciarScanner() {

    errorElement.textContent = "";

    productoElement.innerHTML =
      "Apuntá la cámara al código de barras.";

    productoBox.classList.remove(
      "encontrado",
      "no-encontrado"
    );

    statusElement.textContent =
      "Solicitando acceso a la cámara...";


    /*
    Verificar HTTPS
    */

    if (
      location.protocol !== "https:" &&
      location.hostname !== "localhost" &&
      location.hostname !== "127.0.0.1"
    ) {

      errorElement.textContent =
        "La cámara necesita HTTPS. Si estás usando GitHub Pages, Vercel o Netlify, asegurate de abrir la URL HTTPS.";

      statusElement.textContent =
        "Se necesita una conexión segura.";

      return;
    }


    /*
    Crear scanner
    */

    if (!scanner) {

      scanner = new Html5Qrcode("reader");

    }


    try {

      const cameras =
        await Html5Qrcode.getCameras();


      if (!cameras || cameras.length === 0) {

        throw new Error(
          "No se encontró ninguna cámara en este dispositivo."
        );

      }


      /*
      Buscar cámara trasera
      */

      let camaraTrasera = cameras.find(camera => {

        const nombre =
          camera.label.toLowerCase();

        return (
          nombre.includes("back") ||
          nombre.includes("trasera") ||
          nombre.includes("rear") ||
          nombre.includes("environment")
        );

      });


      /*
      Si no encuentra trasera,
      utiliza la primera disponible.
      */

      const cameraId =
        camaraTrasera
          ? camaraTrasera.id
          : cameras[0].id;


      statusElement.textContent =
        "Cámara activada. Apuntá al código.";


      await scanner.start(

        cameraId,

        {
          fps: 10,

          qrbox: function(viewfinderWidth, viewfinderHeight) {

            const size =
              Math.min(
                viewfinderWidth * 0.85,
                180
              );

            return {
              width: size,
              height: size * 0.45
            };

          },

          aspectRatio: 1.0,

          formatsToSupport: [

            Html5QrcodeSupportedFormats.EAN_13,

            Html5QrcodeSupportedFormats.EAN_8,

            Html5QrcodeSupportedFormats.UPC_A,

            Html5QrcodeSupportedFormats.UPC_E,

            Html5QrcodeSupportedFormats.CODE_128,

            Html5QrcodeSupportedFormats.CODE_39,

            Html5QrcodeSupportedFormats.ITF

          ]

        },

        codigoDetectado,

        errorDeEscaneo

      );


      detenerButton.style.display =
        "block";


      escanearNuevamente.style.display =
        "none";


    } catch (error) {

      console.error(
        "Error iniciando cámara:",
        error
      );

      statusElement.textContent =
        "No se pudo abrir la cámara.";

      errorElement.textContent =
        error.message ||
        "Tenés que permitir el acceso a la cámara.";

    }

  }


  /*
  =====================================================
  CÓDIGO DETECTADO
  =====================================================
  */

  async function codigoDetectado(decodedText) {

    /*
    Evitar múltiples lecturas
    */

    if (procesando) {
      return;
    }


    if (
      decodedText === ultimoCodigo
    ) {

      return;

    }


    procesando = true;

    ultimoCodigo =
      decodedText;


    console.log(
      "Código detectado:",
      decodedText
    );


    /*
    Mostrar código
    */

    codeElement.textContent =
      decodedText;


    statusElement.textContent =
      "Código detectado. Buscando producto...";


    /*
    Vibración
    */

    if (
      navigator.vibrate
    ) {

      navigator.vibrate(150);

    }


    /*
    Sonido
    */

    reproducirBeep();


    /*
    Detener cámara
    */

    try {

      await scanner.stop();

      detenerButton.style.display =
        "none";

    } catch (error) {

      console.log(
        "No se pudo detener:",
        error
      );

    }


    /*
    Buscar en Supabase
    */

    await buscarProducto(
      decodedText
    );

  }


  /*
  =====================================================
  BUSCAR PRODUCTO
  =====================================================
  */

  async function buscarProducto(codigo) {

    try {

      console.log(
        "Buscando:",
        codigo
      );


      const {
        data,
        error
      } = await supabaseClient

        .from("productos")

        .select(
          "codigo_barras, nombre, marca, precio, imagen"
        )

        .eq(
          "codigo_barras",
          codigo
        )

        .maybeSingle();


      /*
      Error de Supabase
      */

      if (error) {

        console.error(
          "Error Supabase:",
          error
        );

        statusElement.textContent =
          "Error consultando la base de datos.";

        errorElement.textContent =
          error.message;

        return;

      }


      /*
      Producto inexistente
      */

      if (!data) {

        productoBox.classList.add(
          "no-encontrado"
        );

        productoElement.innerHTML = `

          <strong>
            ❌ Producto no encontrado
          </strong>

          <br>

          <span class="marca">
            El código ${escaparHTML(codigo)}
            no está registrado.
          </span>

        `;

        statusElement.textContent =
          "Producto no encontrado.";

        escanearNuevamente.style.display =
          "block";

        return;

      }


      /*
      Producto encontrado
      */

      productoBox.classList.add(
        "encontrado"
      );


      let html = `

        <strong>
          ${escaparHTML(
            data.nombre || "Sin nombre"
          )}
        </strong>

      `;


      if (data.marca) {

        html += `

          <br>

          <span class="marca">
            ${escaparHTML(data.marca)}
          </span>

        `;

      }


      if (
        data.precio !== null &&
        data.precio !== undefined
      ) {

        html += `

          <div class="precio">
            $${formatearPrecio(data.precio)}
          </div>

        `;

      }


      productoElement.innerHTML =
        html;


      statusElement.textContent =
        "✅ Producto encontrado";


      escanearNuevamente.style.display =
        "block";


    } catch (error) {

      console.error(
        "Error:",
        error
      );

      statusElement.textContent =
        "Error de conexión.";

      errorElement.textContent =
        error.message ||
        "No se pudo consultar el producto.";

    }

  }


  /*
  =====================================================
  ESCANEAR NUEVAMENTE
  =====================================================
  */

  escanearNuevamente.addEventListener(
    "click",
    async function() {

      procesando = false;

      ultimoCodigo = "";

      codeElement.textContent =
        "—";

      productoElement.innerHTML =
        "Apuntá la cámara al código.";

      productoBox.classList.remove(
        "encontrado",
        "no-encontrado"
      );

      errorElement.textContent = "";

      await iniciarScanner();

    }
  );


  /*
  =====================================================
  DETENER
  =====================================================
  */

  detenerButton.addEventListener(
    "click",
    async function() {

      try {

        if (scanner) {

          await scanner.stop();

        }

      } catch (error) {

        console.log(error);

      }

      detenerButton.style.display =
        "none";

      escanearNuevamente.style.display =
        "block";

      statusElement.textContent =
        "Cámara detenida.";

    }
  );


  /*
  =====================================================
  SONIDO
  =====================================================
  */

  function reproducirBeep() {

    try {

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


      if (!AudioContext) {
        return;
      }


      const audio =
        new AudioContext();


      const oscillator =
        audio.createOscillator();


      const gain =
        audio.createGain();


      oscillator.frequency.value =
        900;


      oscillator.type =
        "sine";


      gain.gain.value =
        0.08;


      oscillator.connect(gain);

      gain.connect(
        audio.destination
      );


      oscillator.start();


      oscillator.stop(
        audio.currentTime + 0.12
      );

    } catch (error) {

      console.log(
        "No se pudo reproducir sonido"
      );

    }

  }


  /*
  =====================================================
  FORMATEAR PRECIO
  =====================================================
  */

  function formatearPrecio(precio) {

    return Number(precio)
      .toLocaleString(
        "es-AR"
      );

  }


  /*
  =====================================================
  SEGURIDAD HTML
  =====================================================
  */

  function escaparHTML(valor) {

    return String(valor)

      .replaceAll("&", "&amp;")

      .replaceAll("<", "&lt;")

      .replaceAll(">", "&gt;")

      .replaceAll('"', "&quot;")

      .replaceAll("'", "&#039;");

  }


  /*
  =====================================================
  ERROR DE ESCANEO
  =====================================================
  */

  function errorDeEscaneo(errorMessage) {

    /*
    No mostramos errores constantemente
    porque html5-qrcode los genera mientras
    busca el código.
    */

  }


  /*
  =====================================================
  INICIAR
  =====================================================
  */

  window.addEventListener(
    "load",
    function() {

      iniciarScanner();

    }
  );


</script>

</body>
</html>
